<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Jeyachandran Gold House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      try {
        if (sessionStorage.getItem('auth:logging-out') === '1' && !window.location.pathname.endsWith('/login')) {
          document.documentElement.classList.add('auth-logging-out');
          var overlay = document.createElement('div');
          overlay.id = 'auth-logout-overlay';
          overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#f8f5f0';
          document.addEventListener('DOMContentLoaded', function () {
            document.body.appendChild(overlay);
            window.location.href = '/login';
          });
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
